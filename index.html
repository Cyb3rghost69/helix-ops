<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4fa3">
<meta name="application-name" content="HELIX OPS">
<meta name="apple-mobile-web-app-title" content="HELIX/OPS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HELIX/OPS</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<style>
  /* first paint before the app stylesheet arrives */
  html, body { margin: 0; background: #0b0910; color: #ece8f4; }
  #app:empty::before { content: "INSERT COIN_"; position: fixed; inset: 0; display: grid; place-items: center; font: 14px ui-monospace, monospace; letter-spacing: .2em; color: #ff4fa3; }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">HELIX/OPS needs JavaScript. <a href="legacy">Open the classic dashboard</a>.</p></noscript>
<script>
  (function () {
    var V = "hos1200";
    window.HELIX_ASSET_V = V;
    var P = (location.pathname === "/ops" || location.pathname.indexOf("/ops/") === 0) ? "/ops" : "";
    function icon(rel, href) { var l = document.createElement("link"); l.rel = rel; l.href = P + href + "?v=" + V; document.head.appendChild(l); }
    icon("icon", "/helix-arcade-mark.svg"); icon("apple-touch-icon", "/app/icons/apple-touch-icon.png");
    ["silkscreen-400", "silkscreen-700", "vt323-400", "plexmono-400"].forEach(function (f) { var l = document.createElement("link"); l.rel = "preload"; l.as = "font"; l.type = "font/woff"; l.crossOrigin = "anonymous"; l.href = P + "/app/fonts/" + f + ".woff"; document.head.appendChild(l); });
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", function () { navigator.serviceWorker.register(P + "/sw.js", { scope: P + "/" }).catch(function () {}); });
    }
    var css = document.createElement("link"); css.rel = "stylesheet"; css.href = P + "/app/arcade.css?v=" + V; document.head.appendChild(css);
    var files = ["/app/core.js", "/app/mesh.js", "/app/avatar.js", "/app/pages.js", "/app/lights.js", "/app/admin.js"], i = 0;
    (function next() {
      if (i >= files.length) { window.Helix.start(); return; }
      var s = document.createElement("script"); s.src = P + files[i++] + "?v=" + V; s.onload = next;
      s.onerror = function () { document.getElementById("app").innerHTML = '<p style="padding:24px;font-family:monospace">Failed to load ' + s.src + ' — <a href="' + P + '/legacy">classic dashboard</a></p>'; };
      document.body.appendChild(s);
    })();
  })();
</script>
</body>
</html>
